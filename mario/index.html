<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightrunner - Missile Hero</title>
<style>
  html,body{margin:0;height:100%;background:#05060d;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{background:#05060d;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:min(100vw,177.78vh);image-rendering:pixelated;box-shadow:0 0 60px #1a2a6c55;touch-action:none}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #pad{display:none}
  .touch #pad{display:block}
  .tb{position:fixed;bottom:4vmin;width:17vmin;height:17vmin;min-width:64px;min-height:64px;border-radius:50%;background:#1d2656aa;border:2px solid #37e2d5;color:#cfe3ff;font:bold 6vmin monospace;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px #37e2d555;touch-action:none}
  .tb.on{background:#37e2d5aa;color:#05060d}
  #bl{left:3vmin}#br{left:calc(3vmin + 20vmin)}
  #bj{right:calc(3vmin + 20vmin)}#bf{right:3vmin;border-color:#ff9e3d;box-shadow:0 0 14px #ff9e3d55}
  #rot{display:none;position:fixed;inset:0;background:#05060d;color:#cfe3ff;font:20px monospace;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9}
  @media (orientation:portrait){.touch #rot{display:flex}}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="pad">
  <div class="tb" id="bl" data-k="ArrowLeft">◀</div>
  <div class="tb" id="br" data-k="ArrowRight">▶</div>
  <div class="tb" id="bj" data-k="Space">▲</div>
  <div class="tb" id="bf" data-k="KeyX">🚀</div>
</div>
<div id="rot">Rotate your phone to landscape to play</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, T = 32, COLS = 232, ROWS = 17;

/* ---------- audio (synthesized, no external files) ---------- */
let ac = null, muted = false;
function beep(f1, f2, dur, type='square', vol=0.06){
  if(muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), ac.currentTime+dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}
function noise(dur, vol=0.12){
  if(muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const n = ac.sampleRate*dur, b = ac.createBuffer(1,n,ac.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer=b; g.gain.value=vol; s.connect(g).connect(ac.destination); s.start();
  }catch(e){}
}
const sfx = {
  jump:()=>beep(300,700,0.15), coin:()=>{beep(900,1400,0.1,'square',0.05)},
  shoot:()=>{beep(500,120,0.25,'sawtooth',0.06); noise(0.12,0.05)},
  boom:()=>{noise(0.4,0.16); beep(140,30,0.35,'sawtooth',0.08)},
  stomp:()=>beep(200,80,0.12,'square',0.08), hurt:()=>beep(300,60,0.4,'sawtooth',0.09),
  bump:()=>beep(160,110,0.08,'square',0.06), win:()=>{[500,650,800,1000].forEach((f,i)=>setTimeout(()=>beep(f,f*1.01,0.18,'square',0.06),i*140))}
};

/* ---------- input ---------- */
const keys = {}, pressed = {};
addEventListener('keydown', e => {
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if(e.code==='KeyM') muted = !muted;
});
addEventListener('keyup', e => { keys[e.code] = false; });
// touch controls
if('ontouchstart' in window || navigator.maxTouchPoints>0) document.documentElement.classList.add('touch');
document.querySelectorAll('.tb').forEach(b => {
  const k = b.dataset.k;
  const on  = e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); if(!keys[k]) pressed[k]=true; keys[k]=true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[k]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev => b.addEventListener(ev, off));
});
cv.addEventListener('pointerdown', () => { pressed['Enter'] = true; });   // tap screen to start / restart
const down = (...c) => c.some(k => keys[k]);
const hit  = (...c) => c.some(k => pressed[k]);

/* ---------- level ---------- */
// tiles: 0 empty, 1 ground, 2 brick, 3 ? block, 4 used block, 5 pipe
const map = Array.from({length:ROWS}, () => new Array(COLS).fill(0));
const gaps = [[28,30],[58,60],[92,95],[121,124],[150,152],[176,179]];
for(let c=0;c<COLS;c++){
  if(gaps.some(g => c>=g[0] && c<=g[1])) continue;
  map[15][c]=1; map[16][c]=1;
}
const put=(c,r,t)=>{ if(map[r]) map[r][c]=t; };
const row=(c1,c2,r,t)=>{ for(let c=c1;c<=c2;c++) put(c,r,t); };
// platforms
row(12,16,12,2); put(14,12,3);
row(22,24,12,2); row(23,23,9,3);
row(36,40,12,2); put(38,12,3); row(38,40,9,2);
row(46,48,12,3);
row(64,68,12,2); row(66,70,9,2); put(68,9,3);
row(80,82,12,2); put(81,12,3);
row(100,103,12,2); row(105,108,9,2); row(110,113,12,2);
row(128,133,12,2); put(130,12,3); put(131,12,3);
row(140,142,9,2);
row(158,162,12,2); row(160,164,9,2); put(162,9,3);
row(184,188,12,2); put(186,12,3);
// pipes
const pipe=(c,h)=>{ for(let r=15-h;r<15;r++){ put(c,r,5); put(c+1,r,5);} };
pipe(52,2); pipe(75,3); pipe(86,2); pipe(116,3); pipe(146,2); pipe(170,3);
// end stairs
for(let i=0;i<8;i++){ for(let r=14-i;r<15;r++) put(198+i,r,1); }
const FLAG_C = 220;

const enemySpawns = [
  ['walker',18],['walker',26],['walker',34],['walker',42],['flyer',47,8],['walker',55],['walker',63],
  ['flyer',69,7],['walker',72],['walker',78],['walker',84],['walker',90],['flyer',97,8],['walker',104],
  ['walker',109],['walker',118],['flyer',125,6],['walker',129],['walker',135],['walker',138],['flyer',143,7],
  ['walker',148],['walker',156],['walker',163],['flyer',168,8],['walker',173],['walker',182],['walker',186],
  ['flyer',190,7],['walker',193],['walker',214],['walker',217]
];
const coinSpots = [];
function coinRow(c1,c2,r){ for(let c=c1;c<=c2;c++) coinSpots.push([c*T+16, r*T+16]); }
coinRow(12,16,10); coinRow(22,24,10); coinRow(36,40,10); coinRow(64,68,10); coinRow(100,103,10);
coinRow(128,133,10); coinRow(158,162,10); coinRow(184,188,10);
[[29,12],[59,12],[93,11],[94,11],[122,10],[123,10],[151,11],[177,10],[178,10]].forEach(([c,r])=>coinSpots.push([c*T+16,r*T+16]));
coinRow(105,108,7); coinRow(66,70,7);

const solid = (c,r) => {
  if(c<0 || c>=COLS) return true;
  if(r<0 || r>=ROWS) return false;
  return map[r][c] !== 0;
};

/* ---------- state ---------- */
let state = 'title', player, enemies, missiles, coins, particles, rings, floaters;
let cam = 0, shake = 0, score = 0, coinCount = 0, lives = 3, timeT = 0;

function resetLevel(){
  player = {x:3*T, y:13*T, w:24, h:30, vx:0, vy:0, face:1, ground:false, coyote:0, buf:0,
            hp:3, inv:0, cool:0, anim:0, dead:false, recoil:0};
  enemies = enemySpawns.map(([t,c,r]) => t==='walker'
    ? {t, x:c*T+2, y:13*T, w:28, h:28, vx:-45, vy:0, alive:true, dying:0}
    : {t, x:c*T, y:r*T, baseY:r*T, w:30, h:24, vx:-35, vy:0, alive:true, dying:0, ph:Math.random()*6});
  missiles = []; particles = []; rings = []; floaters = [];
  coins = coinSpots.map(([x,y]) => ({x,y,got:false}));
  cam = 0; coinCount = 0;
}
function newGame(){ score = 0; lives = 3; resetLevel(); state='play'; }

/* ---------- physics ---------- */
function moveX(e, dx){
  e.x += dx; let hitW = false;
  const top = Math.floor(e.y/T), bot = Math.floor((e.y+e.h-0.01)/T);
  if(dx>0){ const c = Math.floor((e.x+e.w)/T); for(let r=top;r<=bot;r++) if(solid(c,r)){ e.x = c*T-e.w; hitW=true; break; } }
  else if(dx<0){ const c = Math.floor(e.x/T); for(let r=top;r<=bot;r++) if(solid(c,r)){ e.x = (c+1)*T; hitW=true; break; } }
  return hitW;
}
function moveY(e, dy){
  e.y += dy; let landed=false, bumped=null;
  const l = Math.floor(e.x/T), r2 = Math.floor((e.x+e.w-0.01)/T);
  if(dy>0){ const r = Math.floor((e.y+e.h)/T); for(let c=l;c<=r2;c++) if(solid(c,r)){ e.y = r*T-e.h; e.vy=0; landed=true; break; } }
  else if(dy<0){ const r = Math.floor(e.y/T); for(let c=l;c<=r2;c++) if(solid(c,r)){ e.y=(r+1)*T; e.vy=0; bumped=[c,r]; break; } }
  return {landed, bumped};
}
const rect = (a,b) => a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;

/* ---------- fx ---------- */
function spark(x,y,n,cols,sp=220,life=0.6){
  for(let i=0;i<n;i++){ const a=Math.random()*6.283, s=Math.random()*sp;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:life*(0.5+Math.random()*0.7),max:life,c:cols[(Math.random()*cols.length)|0],sz:2+Math.random()*4,g:400}); }
}
function floatText(x,y,t,c='#ffe066'){ floaters.push({x,y,t,c,life:0.9}); }
function explode(x,y){
  sfx.boom(); shake = 10;
  rings.push({x,y,r:6,life:0.35,max:0.35});
  spark(x,y,36,['#ffb347','#ff6a3d','#fff3b0','#ff3d6e'],320,0.7);
  spark(x,y,14,['#444','#666','#222'],120,1.0);
  const R = 52;
  enemies.forEach(en => { if(en.alive){ const dx=en.x+en.w/2-x, dy=en.y+en.h/2-y; if(dx*dx+dy*dy<R*R) killEnemy(en,'missile'); } });
}
function killEnemy(en, how){
  if(!en.alive) return; en.alive=false; en.dying=0.35;
  score += 100; floatText(en.x+en.w/2, en.y, '+100');
  if(how!=='missile') spark(en.x+en.w/2,en.y+en.h/2,10,['#7cf','#fff','#8f8'],180,0.5);
}
function hurtPlayer(dir){
  if(player.inv>0 || player.dead) return;
  player.hp--; player.inv = 1.6; sfx.hurt(); shake = 8;
  player.vx = dir*220; player.vy = -330;
  if(player.hp<=0) die();
}
function die(){
  if(player.dead) return; player.dead = true; player.vy = -520; player.vx = 0; sfx.hurt();
  state = 'dying'; timeT = 0;
}

/* ---------- update ---------- */
function update(dt){
  timeT += dt;
  if(state==='title'){ if(hit('Enter','Space')) newGame(); return; }
  if(state==='gameover' || state==='win'){ if(hit('Enter')){ state='title'; resetLevel(); } return; }

  const p = player;
  if(state==='dying'){
    p.vy += 1400*dt; p.y += p.vy*dt;
    if(timeT>1.6){ lives--; if(lives<=0){ state='gameover'; } else { resetLevel(); state='play'; } }
    updateFx(dt); return;
  }

  // movement
  const ax = 1500, maxV = down('ShiftLeft','ShiftRight') ? 270 : 210, fr = 1300;
  const L = down('ArrowLeft','KeyA'), R = down('ArrowRight','KeyD');
  if(L && !R){ p.vx -= ax*dt; p.face=-1; }
  else if(R && !L){ p.vx += ax*dt; p.face=1; }
  else { const d = fr*dt; p.vx = Math.abs(p.vx)<=d ? 0 : p.vx - Math.sign(p.vx)*d; }
  p.vx = Math.max(-maxV, Math.min(maxV, p.vx));

  p.coyote = p.ground ? 0.1 : p.coyote - dt;
  p.buf -= dt;
  if(hit('ArrowUp','KeyW','Space')) p.buf = 0.12;
  if(p.buf>0 && p.coyote>0){ p.vy = -610; p.coyote=0; p.buf=0; p.ground=false; sfx.jump(); }
  if(!down('ArrowUp','KeyW','Space') && p.vy<-220) p.vy += 2600*dt;   // short hop
  p.vy = Math.min(900, p.vy + 1450*dt);

  moveX(p, p.vx*dt);
  if(p.x<0) p.x=0;
  const res = moveY(p, p.vy*dt);
  p.ground = res.landed;
  if(res.bumped){
    const [c,r] = res.bumped, t = map[r][c];
    if(t===3){ map[r][c]=4; score+=50; coinCount++; sfx.coin(); floatText(c*T+16,r*T-4,'+50'); spark(c*T+16,r*T,8,['#ffe066','#fff'],150,0.5); }
    else if(t===2){ sfx.bump(); spark(c*T+16,r*T+16,5,['#a56bd6','#6c3a9a'],120,0.4); }
  }
  if(p.y > ROWS*T+40){ p.hp=0; die(); return; }

  // shoot missile
  p.cool -= dt; p.inv = Math.max(0, p.inv-dt); p.recoil = Math.max(0,p.recoil-dt);
  if((hit('KeyX','KeyJ','KeyZ','KeyK') || down('KeyX','KeyJ','KeyZ','KeyK')) && p.cool<=0 && missiles.length<4){
    p.cool = 0.32; p.recoil = 0.1; sfx.shoot();
    missiles.push({x:p.x+p.w/2+p.face*16, y:p.y+12, vx:p.face*(520+Math.abs(p.vx)*0.3), dir:p.face, life:1.6, w:20, h:8});
    p.vx -= p.face*40;
    spark(p.x+p.w/2+p.face*20, p.y+12, 5, ['#fff3b0','#ffb347'], 90, 0.25);
  }

  // missiles
  for(const m of missiles){
    m.x += m.vx*dt; m.life -= dt;
    if(Math.random()<0.9) particles.push({x:m.x-m.dir*10,y:m.y+(Math.random()-0.5)*3,vx:-m.dir*40,vy:(Math.random()-0.5)*30,life:0.4,max:0.4,c:Math.random()<0.5?'#ff9e3d':'#8a8a99',sz:3+Math.random()*3,g:-20});
    const box = {x:m.x-m.w/2,y:m.y-m.h/2,w:m.w,h:m.h};
    let boom = false;
    if(solid(Math.floor((m.x+m.dir*10)/T), Math.floor(m.y/T))) boom = true;
    for(const en of enemies) if(en.alive && rect(box,en)) boom = true;
    if(boom || m.life<=0){ m.dead=true; if(boom) explode(m.x+m.dir*8,m.y); }
  }
  missiles = missiles.filter(m=>!m.dead);

  // enemies
  for(const en of enemies){
    if(!en.alive){ en.dying-=dt; continue; }
    if(en.x < cam-100 || en.x > cam+W+100) continue;      // only active near screen
    if(en.t==='walker'){
      en.vy = Math.min(800, en.vy+1450*dt);
      const hw = moveX(en, en.vx*dt);
      const rs = moveY(en, en.vy*dt);
      const ahead = en.vx>0 ? Math.floor((en.x+en.w+2)/T) : Math.floor((en.x-2)/T);
      const below = Math.floor((en.y+en.h+4)/T);
      if(hw || (rs.landed && !solid(ahead, below))) en.vx = -en.vx;
      if(en.y>ROWS*T) en.alive=false;
    } else {
      en.ph += dt*2.2; en.x += en.vx*dt; en.y = en.baseY + Math.sin(en.ph)*34;
      if(Math.sin(en.ph*0.5)>0.98) en.vx=-en.vx;
    }
    if(p.dead || p.inv>0 && false) continue;
    if(rect(p,en)){
      if(p.vy>80 && p.y+p.h < en.y+en.h*0.65){ killEnemy(en,'stomp'); sfx.stomp(); p.vy=-420; }
      else hurtPlayer(p.x+p.w/2 < en.x+en.w/2 ? -1 : 1);
    }
  }

  // coins
  for(const c of coins) if(!c.got && Math.abs(c.x-(p.x+p.w/2))<20 && Math.abs(c.y-(p.y+p.h/2))<24){
    c.got=true; coinCount++; score+=50; sfx.coin(); spark(c.x,c.y,6,['#ffe066','#fff'],120,0.4);
  }

  // flag
  if(p.x+p.w > FLAG_C*T && state==='play'){ state='win'; sfx.win(); score += player.hp*500; spark(FLAG_C*T,8*T,60,['#7cf','#ffe066','#ff6a9e','#9f9'],300,1.4); }

  // camera
  const target = Math.max(0, Math.min(COLS*T-W, p.x - W*0.4));
  cam += (target-cam)*Math.min(1,dt*8);
  p.anim += Math.abs(p.vx)*dt*0.06;
  updateFx(dt);
}
function updateFx(dt){
  for(const q of particles){ q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=q.g*dt; }
  particles = particles.filter(q=>q.life>0);
  for(const r of rings){ r.life-=dt; r.r += 260*dt; }
  rings = rings.filter(r=>r.life>0);
  for(const f of floaters){ f.life-=dt; f.y-=40*dt; }
  floaters = floaters.filter(f=>f.life>0);
  shake = Math.max(0, shake-30*dt);
}

/* ---------- drawing ---------- */
// deterministic star field
let seed = 7; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
const stars = Array.from({length:140}, () => ({x:rnd()*W*2, y:rnd()*H*0.65, s:rnd()*1.8+0.4, p:rnd()*6}));
const hills = (off,amp,col,par,seedOff) => {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=16){ const wx = x + cam*par;
    ctx.lineTo(x, H-110-off - (Math.sin((wx+seedOff)*0.006)*amp + Math.sin((wx+seedOff)*0.017)*amp*0.4)); }
  ctx.lineTo(W,H); ctx.fill();
};
function drawBackground(){
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#04050f'); g.addColorStop(0.6,'#0b1030'); g.addColorStop(1,'#1a1240');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(const s of stars){ const x = ((s.x - cam*0.1)%(W*2)+W*2)%(W*2); if(x>W) continue;
    ctx.globalAlpha = 0.5+0.5*Math.sin(timeT*1.5+s.p); ctx.fillStyle='#cfe3ff'; ctx.fillRect(x,s.y,s.s,s.s); }
  ctx.globalAlpha=1;
  // moon
  ctx.fillStyle='#e8eeff'; ctx.shadowColor='#8fa8ff'; ctx.shadowBlur=40; ctx.beginPath(); ctx.arc(780,90,34,0,6.283); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#0b1030'; ctx.beginPath(); ctx.arc(794,82,30,0,6.283); ctx.fill();
  hills(150,60,'#0a0e28',0.15,0); hills(70,50,'#0d1236',0.3,900); hills(0,36,'#11173f',0.5,300);
}
function drawTile(t,x,y,c,r){
  if(t===1){
    ctx.fillStyle='#141a3a'; ctx.fillRect(x,y,T,T);
    ctx.fillStyle='#1d2656'; ctx.fillRect(x+1,y+1,T-2,T-2);
    if(!solid(c,r-1)){ ctx.fillStyle='#37e2d5'; ctx.fillRect(x,y,T,4); ctx.fillStyle='#37e2d555'; ctx.fillRect(x,y+4,T,3); }
    ctx.fillStyle='#2a357a'; ctx.fillRect(x+6,y+14,4,4); ctx.fillRect(x+20,y+22,4,4);
  } else if(t===2){
    ctx.fillStyle='#2a1a45'; ctx.fillRect(x,y,T,T);
    ctx.strokeStyle='#a56bd6'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,T-2,T-2);
    ctx.beginPath(); ctx.moveTo(x,y+16); ctx.lineTo(x+T,y+16); ctx.moveTo(x+16,y); ctx.lineTo(x+16,y+16); ctx.moveTo(x+8,y+16); ctx.lineTo(x+8,y+T); ctx.moveTo(x+24,y+16); ctx.lineTo(x+24,y+T); ctx.stroke();
  } else if(t===3){
    const gl = 0.6+0.4*Math.sin(timeT*4+c);
    ctx.fillStyle='#4a3500'; ctx.fillRect(x,y,T,T);
    ctx.shadowColor='#ffd23d'; ctx.shadowBlur=14*gl; ctx.fillStyle='#ffc933'; ctx.fillRect(x+2,y+2,T-4,T-4); ctx.shadowBlur=0;
    ctx.fillStyle='#4a3500'; ctx.font='bold 20px monospace'; ctx.textAlign='center'; ctx.fillText('?',x+16,y+23);
  } else if(t===4){
    ctx.fillStyle='#1a1a26'; ctx.fillRect(x,y,T,T); ctx.strokeStyle='#33334a'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,T-2,T-2);
  } else if(t===5){
    ctx.fillStyle='#0f3b36'; ctx.fillRect(x,y,T,T);
    ctx.fillStyle='#16a085'; ctx.fillRect(x+2,y,6,T); ctx.fillStyle='#37e2d5'; ctx.fillRect(x+4,y,3,T);
    if(!solid(c,r-1)){ ctx.fillStyle='#16a085'; ctx.fillRect(x-(solid(c-1,r)&&map[r][c-1]===5?0:3),y,T+(solid(c+1,r)&&map[r][c+1]===5?0:3)+(solid(c-1,r)&&map[r][c-1]===5?0:0),10); ctx.fillStyle='#37e2d5'; ctx.fillRect(x,y,T,3); }
  }
}
function drawLevel(){
  const c0 = Math.max(0,Math.floor(cam/T)), c1 = Math.min(COLS-1, c0+Math.ceil(W/T)+1);
  ctx.textAlign='center';
  for(let r=0;r<ROWS;r++) for(let c=c0;c<=c1;c++){ const t=map[r][c]; if(t) drawTile(t,c*T-cam,r*T,c,r); }
  // flag
  const fx = FLAG_C*T-cam;
  ctx.fillStyle='#9aa5ff'; ctx.fillRect(fx,5*T,4,10*T);
  ctx.shadowColor='#37e2d5'; ctx.shadowBlur=12; ctx.fillStyle='#37e2d5';
  const wv = Math.sin(timeT*4)*3; ctx.beginPath(); ctx.moveTo(fx+4,5*T); ctx.lineTo(fx+48,5*T+14+wv); ctx.lineTo(fx+4,5*T+30); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.arc(fx+2,5*T-6,6,0,6.283); ctx.fill();
}
function drawCoins(){
  for(const c of coins){ if(c.got) continue; const x=c.x-cam; if(x<-20||x>W+20) continue;
    const w = Math.abs(Math.cos(timeT*4+c.x*0.05))*6+2;
    ctx.shadowColor='#ffd23d'; ctx.shadowBlur=10; ctx.fillStyle='#ffd23d'; ctx.beginPath(); ctx.ellipse(x,c.y,w,9,0,0,6.283); ctx.fill(); ctx.shadowBlur=0; }
}
function drawEnemy(en){
  const x = en.x-cam, y = en.y;
  if(!en.alive){ if(en.dying<=0) return; ctx.globalAlpha = en.dying/0.35; ctx.fillStyle='#7cf'; ctx.fillRect(x,y+en.h-8,en.w,8); ctx.globalAlpha=1; return; }
  if(x<-60||x>W+60) return;
  if(en.t==='walker'){
    // night slime-beetle: dark dome, glowing eyes, little legs
    const bob = Math.sin(timeT*10+en.x)*1.5;
    ctx.fillStyle='#2b1d4e'; ctx.beginPath(); ctx.moveTo(x,y+en.h); ctx.quadraticCurveTo(x+en.w/2,y-12+bob,x+en.w,y+en.h); ctx.fill();
    ctx.strokeStyle='#8a5cff'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#ff4d6d'; ctx.shadowColor='#ff4d6d'; ctx.shadowBlur=8;
    ctx.fillRect(x+7,y+11,5,6); ctx.fillRect(x+17,y+11,5,6); ctx.shadowBlur=0;
    ctx.fillStyle='#8a5cff'; const s=Math.sin(timeT*12+en.x)>0?2:-2; ctx.fillRect(x+3,y+en.h-3,6,3+(s>0?1:0)); ctx.fillRect(x+19,y+en.h-3,6,3+(s<0?1:0));
  } else {
    // glow bat
    const fl = Math.sin(timeT*16+en.x)*8;
    ctx.fillStyle='#3a1d5e'; ctx.beginPath(); ctx.moveTo(x+15,y+12); ctx.lineTo(x-6,y+4+fl); ctx.lineTo(x+4,y+16); ctx.lineTo(x+15,y+14); ctx.lineTo(x+26,y+16); ctx.lineTo(x+36,y+4+fl); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#2b1d4e'; ctx.beginPath(); ctx.ellipse(x+15,y+13,9,9,0,0,6.283); ctx.fill();
    ctx.fillStyle='#ffe066'; ctx.shadowColor='#ffe066'; ctx.shadowBlur=8; ctx.fillRect(x+10,y+10,3,4); ctx.fillRect(x+17,y+10,3,4); ctx.shadowBlur=0;
  }
}
function drawPlayer(){
  const p = player; if(!p) return;
  if(p.inv>0 && Math.floor(p.inv*14)%2===0 && !p.dead) return;
  const x = Math.round(p.x-cam), y = Math.round(p.y), f = p.face;
  ctx.save(); ctx.translate(x+p.w/2, 0); ctx.scale(f,1); ctx.translate(-p.w/2, 0);
  const run = p.ground && Math.abs(p.vx)>20, leg = run ? Math.sin(p.anim*3)*5 : 0, air = !p.ground;
  // legs/boots
  ctx.fillStyle='#10131f'; ctx.fillRect(4+leg,y+23,8,7); ctx.fillRect(13-leg,y+23,8,7);
  if(air){ ctx.fillRect(3,y+24,9,6); ctx.fillRect(13,y+22,9,6); }
  // suit
  ctx.fillStyle='#3b5bdb'; ctx.fillRect(3,y+13,19,11);
  ctx.fillStyle='#2c44a8'; ctx.fillRect(3,y+20,19,4);
  // belt + glowing core
  ctx.fillStyle='#ffd23d'; ctx.fillRect(3,y+19,19,2);
  ctx.fillStyle='#37e2d5'; ctx.shadowColor='#37e2d5'; ctx.shadowBlur=8; ctx.fillRect(10,y+15,5,4); ctx.shadowBlur=0;
  // head
  ctx.fillStyle='#f1c79a'; ctx.fillRect(5,y+5,15,9);
  // cap (orange with star-ish emblem)
  ctx.fillStyle='#ff7a1a'; ctx.fillRect(3,y+1,19,6); ctx.fillRect(14,y+5,10,3);
  ctx.fillStyle='#fff3b0'; ctx.fillRect(8,y+2,4,3);
  // visor eye + moustache
  ctx.fillStyle='#0b1030'; ctx.fillRect(14,y+8,4,3);
  ctx.fillStyle='#5a3a1a'; ctx.fillRect(10,y+12,10,2);
  // missile launcher on shoulder
  const rc = p.recoil>0 ? -3 : 0;
  ctx.fillStyle='#2a2f45'; ctx.fillRect(10+rc,y+9,18,6);
  ctx.fillStyle='#4a5275'; ctx.fillRect(10+rc,y+9,18,2);
  ctx.fillStyle='#ff4d6d'; ctx.fillRect(25+rc,y+10,4,4);
  ctx.fillStyle='#cfd6ff'; ctx.fillRect(7+rc,y+11,5,3);
  ctx.restore();
}
function drawMissile(m){
  const x = m.x-cam, y = m.y;
  ctx.save(); ctx.translate(x,y); ctx.scale(m.dir,1);
  ctx.fillStyle='#d9deef'; ctx.fillRect(-10,-3,16,6);
  ctx.fillStyle='#ff4d6d'; ctx.beginPath(); ctx.moveTo(6,-3); ctx.lineTo(12,0); ctx.lineTo(6,3); ctx.fill();
  ctx.fillStyle='#8a5cff'; ctx.fillRect(-10,-6,5,3); ctx.fillRect(-10,3,5,3);
  ctx.fillStyle='#ffb347'; ctx.shadowColor='#ff9e3d'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.moveTo(-10,-2); ctx.lineTo(-18-Math.random()*6,0); ctx.lineTo(-10,2); ctx.fill();
  ctx.restore(); ctx.shadowBlur=0;
}
function drawFx(){
  for(const q of particles){ ctx.globalAlpha = Math.max(0,q.life/q.max); ctx.fillStyle=q.c; ctx.fillRect(q.x-cam,q.y,q.sz,q.sz); }
  ctx.globalAlpha=1;
  for(const r of rings){ ctx.globalAlpha=r.life/r.max; ctx.strokeStyle='#ffd7a0'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(r.x-cam,r.y,r.r,0,6.283); ctx.stroke(); }
  ctx.globalAlpha=1;
  ctx.font='bold 14px monospace'; ctx.textAlign='center';
  for(const f of floaters){ ctx.globalAlpha=Math.min(1,f.life*2); ctx.fillStyle=f.c; ctx.fillText(f.t,f.x-cam,f.y); }
  ctx.globalAlpha=1;
}
function drawHUD(){
  ctx.textAlign='left'; ctx.font='bold 18px monospace'; ctx.fillStyle='#cfe3ff';
  ctx.fillText('SCORE '+String(score).padStart(6,'0'), 20, 30);
  ctx.fillStyle='#ffd23d'; ctx.fillText('● x'+coinCount, 20, 54);
  ctx.fillStyle='#cfe3ff'; ctx.fillText('LIVES x'+lives, 200, 30);
  for(let i=0;i<3;i++){ ctx.fillStyle = i<player.hp ? '#ff4d6d' : '#2a2f45'; ctx.shadowColor='#ff4d6d'; ctx.shadowBlur = i<player.hp?8:0;
    ctx.fillRect(200+i*26,40,18,14); }
  ctx.shadowBlur=0;
  ctx.textAlign='right'; ctx.fillStyle='#7f8bb8'; ctx.font='13px monospace';
  ctx.fillText('MOVE ←→/AD   JUMP ↑/W/SPACE   MISSILE X/J/Z   RUN SHIFT   MUTE M', W-16, 24);
  // ammo/cooldown bar
  ctx.fillStyle='#1a2040'; ctx.fillRect(W-196,36,180,8);
  ctx.fillStyle='#ff9e3d'; ctx.fillRect(W-196,36,180*(1-Math.max(0,player.cool)/0.32),8);
}
function banner(title, sub, col){
  ctx.fillStyle='rgba(3,4,12,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.shadowColor=col; ctx.shadowBlur=24; ctx.fillStyle=col; ctx.font='bold 64px monospace'; ctx.fillText(title,W/2,H/2-20); ctx.shadowBlur=0;
  ctx.fillStyle='#cfe3ff'; ctx.font='20px monospace'; ctx.fillText(sub,W/2,H/2+30);
}

function render(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawBackground(); drawLevel(); drawCoins();
  enemies.forEach(drawEnemy); missiles.forEach(drawMissile); drawPlayer(); drawFx();
  ctx.restore();
  drawHUD();
  if(state==='title'){
    banner('NIGHTRUNNER','Press ENTER to start  —  fire missiles with X',  '#37e2d5');
    ctx.textAlign='center'; ctx.fillStyle='#7f8bb8'; ctx.font='15px monospace';
    ctx.fillText('Stomp enemies or blow them up. Reach the flag. Mind the pits.', W/2, H/2+66);
  }
  if(state==='gameover') banner('GAME OVER','Score '+score+'   —   ENTER for title','#ff4d6d');
  if(state==='win') banner('LEVEL CLEAR!','Score '+score+'   Coins '+coinCount+'   —   ENTER for title','#ffd23d');
}

/* ---------- loop ---------- */
resetLevel();
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(0.1,(now-last)/1000); last = now;
  const dt = 1/60;
  while(acc>=dt){ update(dt); for(const k in pressed) pressed[k]=false; acc-=dt; }
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
